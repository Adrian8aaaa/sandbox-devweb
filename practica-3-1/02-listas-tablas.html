<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Listas y Tablas</title>
</head>
<body>
    <h1>Listas y Tablas</h1>
    <ul>
        <li>Producto 1
            <dl>
                <dt>Detalle:</dt>
                <dd>Descripción secundaria</dd>
            </dl>
        </li>
    </ul>
    <!-- Usaría lista para elementos independientes y tabla para datos estructurados en filas/columnas -->
    <table border="1">
        <thead>
            <tr><th>Col 1</th><th>Col 2</th><th>Col 3</th><th>Col 4</th></tr>
        </thead>
        <tbody>
            <tr><td>Dato 1</td><td>Dato 2</td><td>Dato 3</td><td>Dato 4</td></tr>
        </tbody>
    </table>
</body>
</html>
